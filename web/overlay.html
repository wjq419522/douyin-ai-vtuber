<script>
const $ = s => document.querySelector(s);
const params = new URLSearchParams(location.search);
if (params.get('green')) document.body.classList.add('green');

/* ---------------- 音频 ---------------- */
const AC = new (window.AudioContext || window.webkitAudioContext)();
const master = AC.createGain(); master.gain.value = .8;
const analyser = AC.createAnalyser(); analyser.fftSize = 512;
const reverb = AC.createConvolver();
(() => { const len = AC.sampleRate * 2.2, b = AC.createBuffer(2, len, AC.sampleRate);
  for (let c = 0; c < 2; c++) { const d = b.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/len, 3); }
  reverb.buffer = b; })();
const wet = AC.createGain(); wet.gain.value = .25;
master.connect(analyser); analyser.connect(AC.destination); master.connect(reverb); reverb.connect(wet); wet.connect(AC.destination);
function ensureAudio() { if (AC.state === 'suspended') { $('#unlock').style.display = 'block'; AC.resume().then(() => $('#unlock').style.display = 'none'); } }
$('#unlock').onclick = () => AC.resume().then(() => $('#unlock').style.display = 'none');

const NOTE = { C:0, D:2, E:4, F:5, G:7, A:9, B:11 };
const freq = n => { const m = /^([A-G])(#?)(\d)$/.exec(n) || [0,'A','',4]; return 440 * Math.pow(2, (NOTE[m[1]] + (m[2]?1:0) + (m[3]-4)*12 - 9) / 12); };

// Karplus-Strong 拨弦（古筝/琵琶/吉他/古琴）
function pluck(f, t, dur, bright = .5, decay = .996) {
  const sr = AC.sampleRate, len = Math.floor(sr * Math.min(dur + 1.5, 3)), buf = AC.createBuffer(1, len, sr), d = buf.getChannelData(0);
  const N = Math.max(2, Math.round(sr / f)), ring = new Float32Array(N);
  for (let i = 0; i < N; i++) ring[i] = Math.random() * 2 - 1;
  let p = 0;
  for (let i = 0; i < len; i++) { const nx = (p + 1) % N; const v = decay * ((1-bright) * ring[p] + bright * .5 * (ring[p] + ring[nx]));
    d[i] = ring[p]; ring[p] = bright === .5 ? decay * .5 * (ring[p] + ring[nx]) : v; p = nx; }
  const s = AC.createBufferSource(), g = AC.createGain(); s.buffer = buf; g.gain.value = .5; s.connect(g); g.connect(master); s.start(t);
}
// 钢琴：多泛音 + 指数衰减
function piano(f, t, dur) {
  [1, 2, 3, 4.01, 5.02].forEach((h, i) => { const o = AC.createOscillator(), g = AC.createGain();
    o.frequency.value = f * h; g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.22 / (i + 1), t + .005);
    g.gain.exponentialRampToValueAtTime(.0001, t + Math.max(.6, dur * 2) / (1 + i * .4)); o.connect(g); g.connect(master); o.start(t); o.stop(t + 3); });
}
// 吹管/拉弦：笛子、箫、二胡（带揉弦颤音）
function sustain(f, t, dur, type) {
  const o = AC.createOscillator(), g = AC.createGain(), lfo = AC.createOscillator(), lg = AC.createGain(), flt = AC.createBiquadFilter();
  o.type = type === 'erhu' ? 'sawtooth' : 'triangle'; o.frequency.value = f;
  if (type === 'erhu') { o.frequency.setValueAtTime(f * .97, t); o.frequency.linearRampToValueAtTime(f, t + .08); }
  lfo.frequency.value = type === 'erhu' ? 6 : 5; lg.gain.value = f * (type === 'erhu' ? .012 : .006); lfo.connect(lg); lg.connect(o.frequency);
  flt.type = type === 'erhu' ? 'bandpass' : 'lowpass'; flt.frequency.value = type === 'erhu' ? 1400 : (type === 'xiao' ? 1200 : 3000); flt.Q.value = type === 'erhu' ? 1.2 : .7;
  const peak = type === 'erhu' ? .35 : .3;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(peak, t + .06); g.gain.setValueAtTime(peak, t + dur * .85); g.gain.linearRampToValueAtTime(0, t + dur);
  o.connect(flt); flt.connect(g); g.connect(master); o.start(t); lfo.start(t); o.stop(t + dur + .05); lfo.stop(t + dur + .05);
  // 气声
  if (type !== 'erhu') { const n = AC.createBufferSource(), nb = AC.createBuffer(1, AC.sampleRate * dur, AC.sampleRate), nd = nb.getChannelData(0);
    for (let i = 0; i < nd.length; i++) nd[i] = (Math.random() * 2 - 1) * .04; n.buffer = nb; const bp = AC.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = f * 2;
    n.connect(bp); bp.connect(master); n.start(t); }
}
// “哼唱”人声：锯齿波 + 共振峰滤波(元音 a)。真唱歌请接 DiffSinger / 训练自有音色的 SVC
let singLevel = 0;
function voice(f, t, dur) {
  const o = AC.createOscillator(), g = AC.createGain(), lfo = AC.createOscillator(), lg = AC.createGain(); o.type = 'sawtooth'; o.frequency.value = f;
  lfo.frequency.value = 5.5; lg.gain.value = f * .015; lfo.connect(lg); lg.connect(o.frequency);
  const mix = AC.createGain(); mix.gain.value = .9;
  [[800, 1, 8], [1150, .5, 9], [2900, .25, 10]].forEach(([fr, gn, q]) => { const b = AC.createBiquadFilter(); b.type = 'bandpass'; b.frequency.value = fr; b.Q.value = q;
    const bg = AC.createGain(); bg.gain.value = gn * 2.2; o.connect(b); b.connect(bg); bg.connect(mix); });
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.5, t + .05); g.gain.setValueAtTime(.5, t + dur * .8); g.gain.linearRampToValueAtTime(0, t + dur);
  mix.connect(g); g.connect(master); o.start(t); lfo.start(t); o.stop(t + dur + .05); lfo.stop(t + dur + .05);
}
const INST = {
  guzheng: { name:'古筝', fn:(f,t,d)=>pluck(f,t,d,.5,.997) }, pipa: { name:'琵琶', fn:(f,t,d)=>{ for (let k=0;k<Math.max(1,Math.round(d*6));k++) pluck(f,t+k/12,.3,.5,.993); } },
  guitar: { name:'吉他', fn:(f,t,d)=>pluck(f/2,t,d,.5,.995) }, guqin: { name:'古琴', fn:(f,t,d)=>pluck(f/2,t,d,.5,.9985) },
  piano: { name:'钢琴', fn:piano }, dizi: { name:'笛子', fn:(f,t,d)=>sustain(f,t,d,'dizi') },
  xiao: { name:'箫', fn:(f,t,d)=>sustain(f/2,t,d,'xiao') }, erhu: { name:'二胡', fn:(f,t,d)=>sustain(f/2,t,d,'erhu') },
};

/* ---------------- 形象控制 ---------------- */
const av = $('#avatar');
let actTimer;
function act(a, ms = 4000) {
  av.setAttribute('class', 'act-' + a); clearTimeout(actTimer); if (ms) actTimer = setTimeout(() => av.setAttribute('class', ''), ms);
  if (VA.on) vaAct(a);
}

/* ---------------- 写实真人视频形象 ----------------
   打开方式：/overlay?avatar=video
   web/avatar/clips.json 列出每个动作对应的视频片段（同一个原创写实人物、同一机位、同一背景），
   例如 {"idle":["idle1.mp4","idle2.mp4"],"talk":["talk1.mp4"],"dance":["dance1.mp4"],"play":["guzheng.mp4"],...}
   说话时：若服务端配置了口型同步服务（LIPSYNC_URL），会播放按本句语音实时生成的口型视频；否则播放通用 talk 片段。 */
const VA = { on: false, clips: {}, cur: 'idle', front: null, back: null };
const VA_LOOP = ['idle', 'talk', 'dance', 'sing', 'play', 'paint'];
async function vaInit() {
  if (params.get('avatar') !== 'video') return;
  try {
    VA.clips = await (await fetch('/web/avatar/clips.json', { cache: 'no-store' })).json();
    if (!VA.clips.idle?.length) throw new Error('clips.json 缺少 idle 片段');
    VA.front = $('#v1'); VA.back = $('#v2'); VA.on = true;
    $('#stage').hidden = true; $('#vstage').hidden = false; vaPlay('idle');
  } catch (e) { console.warn('写实视频形象未启用，回退到 SVG：', e.message); }
}
function vaSrc(name) { return /^(https?:|\/)/.test(name) ? name : '/web/avatar/' + name; }
function vaPlay(a, src) {
  const list = VA.clips[a] || (a === 'sing' ? VA.clips.talk : null) || VA.clips.idle;
  const file = src || list[Math.random() * list.length | 0];
  const v = VA.back; v.src = vaSrc(file); v.loop = !src && VA_LOOP.includes(a); v.currentTime = 0;
  v.onended = () => { if (!v.loop) vaPlay(VA.resume || 'idle'); };
  return v.play().then(() => { v.style.opacity = 1; VA.front.style.opacity = 0; [VA.front, VA.back] = [v, VA.front]; VA.back.pause(); VA.cur = a; })
    .catch(e => { if (e.name !== 'AbortError') console.warn('视频播放失败', file, e.message); });
}
function vaAct(a) {
  a = a || 'idle';
  if (VA_LOOP.includes(a)) { VA.resume = a; VA.gesture = null; vaPlay(a); }
  else { VA.resume = 'idle'; VA.gesture = a; }   // 挥手/点头等短动作：说完话再做，避免被说话片段打断
}
setInterval(() => { const e = $('#eyes'); e.style.transform = 'scaleY(.1)'; setTimeout(() => e.style.transform = '', 120); }, 3200 + Math.random() * 1500);
let speaking = 0, fakeMouth = false;
const td = new Uint8Array(analyser.fftSize);
(function mouthLoop() {
  analyser.getByteTimeDomainData(td); let s = 0; for (const v of td) s += (v - 128) ** 2;
  let lvl = Math.min(1, Math.sqrt(s / td.length) / 30);
  if (fakeMouth) lvl = .3 + .5 * Math.abs(Math.sin(performance.now() / 90));
  speaking += (lvl - speaking) * .4;
  $('#mouth').setAttribute('ry', 2 + speaking * 16); $('#smile').style.opacity = speaking > .15 ? .35 : 1;
  requestAnimationFrame(mouthLoop);
})();

/* ---------------- 语音 ---------------- */
let audioEl = null;
function speak(text, url, useBrowser, talkVideo) {
  if (VA.on && text) { const back = VA.cur; VA.resume = back === 'talk' ? 'idle' : back; vaPlay('talk', talkVideo);
    return speakAudio(text, url, useBrowser).then(() => {
      if (VA.cur !== 'talk') return;
      if (VA.gesture && VA.clips[VA.gesture]) { const g = VA.gesture; VA.gesture = null; vaPlay(g); } else vaPlay(VA.resume || 'idle'); }); }
  return speakAudio(text, url, useBrowser);
}
function speakAudio(text, url, useBrowser) {
  return new Promise(res => {
    if (url) {
      audioEl = new Audio(url); audioEl.crossOrigin = 'anonymous';
      const src = AC.createMediaElementSource(audioEl); src.connect(master);
      audioEl.onended = res; audioEl.onerror = res; audioEl.play().catch(() => { ensureAudio(); res(); });
    } else if (useBrowser && 'speechSynthesis' in window) {
      const u = new SpeechSynthesisUtterance(text); u.lang = 'zh-CN'; u.rate = 1.05; u.pitch = 1.25;
      const v = speechSynthesis.getVoices().find(v => /zh/i.test(v.lang) && /female|xiao|ting|mei|yaoyao|huihui/i.test(v.name)); if (v) u.voice = v;
      fakeMouth = true; const done = () => { fakeMouth = false; res(); };
      u.onend = done; u.onerror = done; setTimeout(done, 400 + text.length * 260); speechSynthesis.speak(u);
    } else { fakeMouth = true; setTimeout(() => { fakeMouth = false; res(); }, 300 + text.length * 180); }
  });
}

/* ---------------- 作诗 ---------------- */
async function showPoem(p) {
  const box = $('#poem .t'); box.innerHTML = '<div class="title">' + [...(p.title || '无题')].map(c => `<span>${esc(c)}</span>`).join('') + '</div>';
  $('#poem').classList.add('on');
  for (const line of p.lines || []) { const div = document.createElement('div'); box.appendChild(div);
    for (const ch of line) { const sp = document.createElement('span'); sp.textContent = ch; div.appendChild(sp); await sleep(120); } }
  setTimeout(() => $('#poem').classList.remove('on'), 12000);
}

/* ---------------- 作画 ---------------- */
function rnd(seed) { let s = 0; for (const c of seed) s = (s * 31 + c.charCodeAt(0)) >>> 0; return () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296; }
function stampLabel(ctx, W) { // 显式标识：画作上直接写“AI生成”
  ctx.save(); ctx.fillStyle = 'rgba(192,57,43,.9)'; ctx.fillRect(W - 210, 24, 186, 64); ctx.fillStyle = '#fff'; ctx.font = 'bold 40px sans-serif'; ctx.fillText('AI生成', W - 180, 70); ctx.restore(); }
async function inkPainting(ctx, prompt) {
  const W = 1024, H = 1024, r = rnd(prompt); ctx.fillStyle = '#f4ecd8'; ctx.fillRect(0, 0, W, H);
  for (let i = 0; i < 3000; i++) { ctx.fillStyle = `rgba(120,100,60,${r() * .04})`; ctx.fillRect(r() * W, r() * H, 2, 2); }
  // 远山 → 近山，逐层“晕染”出来
  for (let L = 0; L < 5; L++) {
    const base = 380 + L * 120, amp = 220 - L * 30, dark = 0.12 + L * 0.13;
    for (let pass = 0; pass < 14; pass++) {
      ctx.beginPath(); ctx.moveTo(0, H);
      for (let x = 0; x <= W; x += 8) { const y = base - amp * Math.abs(Math.sin(x / (150 + L * 40) + L * 2 + r() * .02)) * (.6 + .4 * Math.sin(x / 70 + L)) - pass * 3; ctx.lineTo(x, y + r() * 6); }
      ctx.lineTo(W, H); ctx.closePath(); const g = ctx.createLinearGradient(0, base - amp, 0, base + 160);
      g.addColorStop(0, `rgba(30,35,40,${dark * .12})`); g.addColorStop(1, 'rgba(30,35,40,0)'); ctx.fillStyle = g; ctx.fill();
    }
    // 云雾
    const m = ctx.createLinearGradient(0, base + 20, 0, base + 140); m.addColorStop(0, 'rgba(244,236,216,0)'); m.addColorStop(.5, 'rgba(244,236,216,.85)'); m.addColorStop(1, 'rgba(244,236,216,0)');
    ctx.fillStyle = m; ctx.fillRect(0, base + 20, W, 120); await sleep(350);
  }
  // 松枝 & 小舟
  ctx.strokeStyle = 'rgba(20,20,20,.85)'; ctx.lineWidth = 9; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(60, 1024); ctx.bezierCurveTo(120, 820, 90, 700, 220, 600); ctx.stroke();
  for (let i = 0; i < 26; i++) { const x = 120 + r() * 200, y = 600 + r() * 260; ctx.fillStyle = 'rgba(30,50,40,.55)'; ctx.beginPath(); ctx.ellipse(x, y, 40, 12, -.3, 0, 7); ctx.fill(); await sleep(15); }
  ctx.fillStyle = '#222'; ctx.beginPath(); ctx.moveTo(620, 860); ctx.quadraticCurveTo(680, 885, 760, 860); ctx.lineTo(745, 872); ctx.quadraticCurveTo(680, 890, 635, 872); ctx.fill();
  ctx.fillRect(688, 820, 4, 44);
  // 太阳/月 + 题字 + 印章
  ctx.fillStyle = 'rgba(192,57,43,.75)'; ctx.beginPath(); ctx.arc(800, 200, 48, 0, 7); ctx.fill();
  ctx.fillStyle = '#222'; ctx.font = '56px KaiTi, STKaiti, serif'; [...prompt.slice(0, 8)].forEach((c, i) => ctx.fillText(c, 900, 200 + i * 66));
  ctx.fillStyle = '#b8352b'; ctx.fillRect(895, 760, 72, 72); ctx.fillStyle = '#f4ecd8'; ctx.font = 'bold 30px serif'; ctx.fillText('佳', 915, 790); ctx.fillText('垚', 915, 824);
  stampLabel(ctx, W);
}
async function showPaint(p) {
  const c = $('#paint canvas'), ctx = c.getContext('2d'); $('#paint .cap').textContent = `「${p.prompt}」 · AI作画`; $('#paint').classList.add('on');
  if (p.image) { const img = new Image(); img.crossOrigin = 'anonymous'; img.src = p.image; await img.decode().catch(() => {}); ctx.drawImage(img, 0, 0, 1024, 1024); stampLabel(ctx, 1024); }
  else await inkPainting(ctx, p.prompt || '山水');
  setTimeout(() => $('#paint').classList.remove('on'), 15000);
}

/* ---------------- 演奏 / 唱歌 ---------------- */
async function playScore({ notes = [], bpm = 90, inst = 'guzheng', lyrics = null, title = '' }) {
  ensureAudio();
  const bars = $('#score .bars'); bars.innerHTML = notes.map(() => '<i></i>').join('');
  $('#score .ins').textContent = lyrics ? `♪ ${title || '原创小调'}（AI演唱）` : `♫ ${INST[inst]?.name || inst} · AI演奏`;
  const words = lyrics ? lyrics.join('，') : ''; $('#score .lyr').innerHTML = [...words].map(c => `<span>${c}</span>`).join('');
  $('#score').classList.add('on');
  const beat = 60 / bpm, t0 = AC.currentTime + .15, spans = [...$('#score .lyr').children].filter(s => s.textContent !== '，'); let t = t0;
  notes.forEach(([n, b], i) => {
    const f = freq(n), d = b * beat;
    if (lyrics) { voice(f, t, d * .95); if (i % 2 === 0) pluck(f / 2, t, d, .5, .996); } else INST[inst]?.fn(f, t, d);
    const bar = bars.children[i]; setTimeout(() => { bar.style.height = (30 + (f - 500) / 8) + 'px'; bar.classList.add('hit');
      spans.forEach((s, k) => s.classList.toggle('on', k <= Math.floor(i * spans.length / notes.length))); }, (t - AC.currentTime) * 1000);
    t += d;
  });
  await sleep((t - AC.currentTime) * 1000 + 600);
  setTimeout(() => $('#score').classList.remove('on'), 2500);
}

/* ---------------- 字幕 & 弹幕 ---------------- */
function addDm(m) { const d = document.createElement('div'); d.className = 'dm ' + m.kind; d.innerHTML = `<b>${esc(m.user)}</b>${esc(m.text)}`;
  const f = $('#feed'); f.appendChild(d); while (f.children.length > 6) f.firstChild.remove(); }
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* ---------------- 演出队列 ---------------- */
const jobs = []; let busy = false, stopped = false;
new MutationObserver(() => document.body.classList.toggle('panel-open', !!document.querySelector('.panel.on')))
  .observe(document.body, { subtree: true, attributes: true, attributeFilter: ['class'] });
async function run() {
  if (busy) return; busy = true;
  while (jobs.length && !stopped) {
    const m = jobs.shift();
    $('#sub .q').textContent = m.user ? `${m.user}：${m.question}` : ''; $('#sub .a').textContent = m.say || '';
    const a = m.action || 'idle'; const long = ['dance', 'sing', 'play', 'paint'].includes(a); act(a, long ? 0 : 3500);
    const side = a === 'poem' && m.poem ? showPoem(m.poem) : a === 'paint' && m.paint ? showPaint(m.paint) : null;
    await speak(m.say || '', m.audio, m.browser_tts, m.talk_video);
    if (VA.on && long) vaAct(a);
    if (a === 'sing' && m.song) await playScore({ notes: m.song.notes, bpm: m.song.bpm, lyrics: m.song.lyrics || [], title: m.song.title });
    else if (a === 'play' && m.instrument) await playScore({ notes: m.instrument.notes, bpm: m.instrument.bpm, inst: m.instrument.name });
    else if (a === 'dance') { const dn = pentatonic(32); await playScore({ notes: dn, bpm: 120, inst: 'pipa' }); }
    if (side) await side;
    if (long) act('idle', 1);
    await sleep(500);
  }
  busy = false;
}
function pentatonic(n) { const s = ['C5','D5','E5','G5','A5','C6']; let i = 2; return Array.from({ length: n }, () => [s[i = Math.max(0, Math.min(5, i + [-1, 1, 1, -1, 2, -2][Math.random() * 6 | 0]))], .5]); }

/* ---------------- 连接中控 ---------------- */
function connect() {
  const ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws/overlay');
  ws.onmessage = e => { const m = JSON.parse(e.data);
    if (m.type === 'danmaku') addDm(m);
    else if (m.type === 'perform') { stopped = false; jobs.push(m); run(); }
    else if (m.type === 'stop') { stopped = true; jobs.length = 0; speechSynthesis?.cancel(); audioEl?.pause(); master.gain.value = 0; setTimeout(() => master.gain.value = .8, 500); act('idle', 1); }
    else if (m.type === 'status') { $('#status').textContent = m.operator ? (m.mode === 'paused' ? '⏸ 暂停中' : '● 直播中') : '○ 主播暂离';
      $('#away').classList.toggle('on', !m.operator || m.mode === 'paused'); } };
  ws.onclose = () => { $('#status').textContent = '○ 重连中'; setTimeout(connect, 2000); };
}
vaInit();
connect();
window.__demo = m => { jobs.push(m); run(); }; // 调试用
</script>
